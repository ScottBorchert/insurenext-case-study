<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% block title %}InsureNext{% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #1f2933;
        }

        nav {
            background: #172033;
            color: white;
            padding: 16px 28px;
        }

        nav .nav-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .brand {
            font-size: 20px;
            font-weight: 600;
        }

        main {
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 20px 60px;
        }

        .card {
            background: white;
            border: 1px solid #dfe3e8;
            border-radius: 5px;
            padding: 24px;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            font-weight: 600;
        }

        h2 {
            font-size: 19px;
            font-weight: 600;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd2d9;
            border-radius: 4px;
            font-size: 15px;
        }

        input[readonly] {
            background: #f1f3f5;
        }

        .field {
            margin-bottom: 20px;
        }

        .help {
            font-size: 13px;
            color: #68737d;
            margin-top: 5px;
        }

        button,
        .button {
            display: inline-block;
            border: 0;
            border-radius: 4px;
            padding: 11px 18px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e8edf3;
            color: #172033;
        }

        .success {
            background: #18794e;
            color: white;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .status {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 4px;
            background: #e8edf3;
            font-size: 12px;
            text-transform: uppercase;
        }

        .message {
            background: white;
            border-left: 4px solid #2563eb;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e4e7eb;
        }

        th {
            font-size: 13px;
            color: #52606d;
        }

        .coverage-row {
            display: grid;
            grid-template-columns: 30px 1fr 180px 180px;
            gap: 14px;
            align-items: center;
            margin-bottom: 12px;
        }

        .coverage-row input[type="checkbox"] {
            width: auto;
        }

        pre {
            background: #111827;
            color: #e5e7eb;
            padding: 18px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 13px;
        }

        .locked {
            color: #7c3aed;
            font-size: 12px;
        }

        .program {
            color: #0f766e;
            font-weight: 600;
        }

        .money {
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 700px) {
            .coverage-row {
                grid-template-columns: 30px 1fr;
            }

            nav .nav-inner {
                display: block;
            }

            nav a {
                margin-left: 0;
                margin-right: 15px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="nav-inner">
        <div class="brand">
            InsureNext
        </div>

        <div>
            <a href="{% url 'underwriting:application_new' %}">
                New Application
            </a>

            <a href="{% url 'underwriting:underwriting_queue' %}">
                Underwriting
            </a>

            <a href="/admin/">
                Admin
            </a>
        </div>
    </div>
</nav>

<main>

    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
